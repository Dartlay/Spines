name: spines
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  
  # Navigation
  go_router: ^17.1.0
  
  # State management
  equatable: ^2.0.8
  flutter_bloc: ^9.1.1
  dartz: ^0.10.1
  
  # Storage
  shared_preferences: ^2.5.4
  
  # Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  google_sign_in: ^7.2.0
  
  # DI
  get_it: ^9.2.1
  
  # File handling
  file_picker: ^10.3.10
  path_provider: ^2.1.5
  
  # Utils
  intl: ^0.20.2
  epubx: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_gen_runner: ^5.3.2

flutter:
  generate: true
  
  uses-material-design: true

  assets:
    - assets/data/books.json
    - assets/books/
